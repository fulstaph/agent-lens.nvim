name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  stylua:
    name: StyLua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check .

  luacheck:
    name: Luacheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4 luarocks
          sudo luarocks install luacheck
      - name: Run luacheck
        run: luacheck lua/ plugin/ --globals vim jit --no-max-line-length --no-unused-args

  tests:
    name: Tests (${{ matrix.os }}, Neovim ${{ matrix.neovim }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        neovim: [v0.10.4, stable, nightly]
        include:
          # macOS uses the recursive FSEvents watcher and /private/tmp sockets.
          - os: macos-latest
            neovim: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Headless Lua behavior tests
        run: |
          nvim --version | head -1
          sh tests/run.sh

      - name: Pi extension package and metadata contract
        run: |
          npm run test:extension
          npm pack --dry-run --json

      - name: Live code preview bridge and Neovim lifecycle
        run: npm run test:live
